name = "elle-kay-portfolio"
main = "functions/worker.ts"
compatibility_date = "2026-09-29"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "elle-kay-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "elle-kay-media"

[vars]
SITE_URL = "https://ellekaybuilds.com"
TURNSTILE_SITE_KEY = "REPLACE_WITH_SITE_KEY"
